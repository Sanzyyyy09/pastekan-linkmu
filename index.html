<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070B1A">
<title>Pastekan Linkmu</title>
<meta name="description" content="Simpan dan bagikan teks atau daftar link lewat satu alamat pendek. Gratis, bisa dikunci sandi, dengan masa berlaku dan statistik kunjungan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: header menempel di atas (menu hamburger di HP), halaman beranda satu kolom lebar (hero, form + rak daftar, cara kerja, fitur, FAQ, ajakan), halaman panel (Dashboard, Kelola) berupa kartu bertumpuk.
   Warna: gelap-dulu, biru malam dengan aksen indigo ke ungu; hijau, kuning, merah hanya untuk status. Enam warna fitur untuk ikon. */
:root{
  --bg:#070B1A; --glow1:rgba(99,102,241,.24); --glow2:rgba(168,85,247,.16);
  --surface:#0D1330; --surface2:#141C40; --field:#090E27; --ink:#EEF1FF; --muted:#9AA5CD; --line:#1F2A55;
  --accent:#8B93FF; --accent2:#B28CFF; --accent-soft:rgba(139,147,255,.16);
  --grad:linear-gradient(135deg,#5B5FEF,#8B5CF6); --grad-ink:#FFFFFF;
  --ok:#4ADE80; --ok-soft:rgba(74,222,128,.14); --warn:#FBBF24; --warn-soft:rgba(251,191,36,.14); --bad:#FB7185; --bad-soft:rgba(251,113,133,.15);
  --hl:#FDE68A; --hl-ink:#2A2100;
  --ci1:#8B93FF; --ci2:#FB923C; --ci3:#F472B6; --ci4:#34D399; --ci5:#38BDF8; --ci6:#B28CFF;
  --shadow:0 24px 54px -28px rgba(0,0,0,.8);
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#F3F4FF; --glow1:rgba(99,102,241,.16); --glow2:rgba(168,85,247,.10);
    --surface:#FFFFFF; --surface2:#EDEFFF; --field:#F6F7FF; --ink:#12163A; --muted:#566090; --line:#DADEF5;
    --accent:#4F46E5; --accent2:#7C3AED; --accent-soft:rgba(79,70,229,.10);
    --ok:#15803D; --ok-soft:rgba(21,128,61,.11); --warn:#A15C07; --warn-soft:rgba(161,92,7,.12); --bad:#BE2A46; --bad-soft:rgba(190,42,70,.10);
    --hl:#FDE047;
    --ci1:#4F46E5; --ci2:#C2570C; --ci3:#BE1F6E; --ci4:#047857; --ci5:#0369A1; --ci6:#7C3AED;
    --shadow:0 20px 44px -26px rgba(40,50,140,.35); color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F3F4FF; --glow1:rgba(99,102,241,.16); --glow2:rgba(168,85,247,.10);
  --surface:#FFFFFF; --surface2:#EDEFFF; --field:#F6F7FF; --ink:#12163A; --muted:#566090; --line:#DADEF5;
  --accent:#4F46E5; --accent2:#7C3AED; --accent-soft:rgba(79,70,229,.10);
  --ok:#15803D; --ok-soft:rgba(21,128,61,.11); --warn:#A15C07; --warn-soft:rgba(161,92,7,.12); --bad:#BE2A46; --bad-soft:rgba(190,42,70,.10);
  --hl:#FDE047;
  --ci1:#4F46E5; --ci2:#C2570C; --ci3:#BE1F6E; --ci4:#047857; --ci5:#0369A1; --ci6:#7C3AED;
  --shadow:0 20px 44px -26px rgba(40,50,140,.35); color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background-color:var(--bg);
  background-image:radial-gradient(800px 480px at 8% -6%,var(--glow1),transparent 70%),radial-gradient(700px 460px at 100% 4%,var(--glow2),transparent 70%);
  background-repeat:no-repeat;
  color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.55;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:50}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.g{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.w{max-width:1120px;margin:0 auto}
.mono{font-family:var(--f-mono)}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:68px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.mark{width:42px;height:42px;border-radius:13px;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 10px 22px -8px #6366F1}
.wm{font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1.1;display:block}
.wm b{color:var(--accent);font-weight:800}
.tg{display:block;font-size:11.5px;color:var(--muted);line-height:1.25}
.nav{display:flex;align-items:center;gap:2px}
.nav a,.nav button.nl{padding:8px 13px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted);text-decoration:none;border:0;background:none;cursor:pointer}
.nav a:hover,.nav button.nl:hover{color:var(--ink);background:var(--surface2)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--accent-soft)}
.hr{display:flex;align-items:center;gap:8px}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface2)}
.only-m{display:none}
.mpanel{display:none}
@media (max-width:900px){
  .nav,.hr .dsk{display:none}
  .only-m{display:inline-grid}
  .mpanel.on{display:block;position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:76px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow);z-index:45}
}
.mpanel a{display:flex;align-items:center;gap:14px;padding:13px 12px;border-radius:12px;font-weight:600;text-decoration:none}
.mpanel a:hover,.mpanel a[aria-current="page"]{background:var(--accent-soft)}
.mpanel a svg{color:var(--accent)}
.mpanel .mb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;padding-top:14px;border-top:1px solid var(--line)}

/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .12s,background .12s,border-color .12s,filter .12s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.primary{background:var(--grad);border-color:transparent;color:var(--grad-ink);box-shadow:0 14px 28px -12px #6366F1}
.btn.primary:hover{filter:brightness(1.1)}
.btn.light{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.light:hover{filter:brightness(.94)}
.btn.danger{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn.lg{padding:14px 24px;font-size:15px;border-radius:14px}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.actions.center{justify-content:center}

/* chip */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--accent-soft);color:var(--accent)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

/* halaman */
main.g{padding-block:26px 8px}
.hero{text-align:center;max-width:780px;margin:18px auto 34px;display:flex;flex-direction:column;align-items:center;gap:18px}
.hero h1{font-weight:800;font-size:clamp(32px,6.4vw,58px);line-height:1.06;letter-spacing:-.035em;margin:0;text-wrap:balance}
.hero p{margin:0;color:var(--muted);font-size:clamp(15px,2.4vw,18px);max-width:60ch}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;margin-top:10px}
@media (max-width:560px){.trio{gap:8px}}
.tri{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 10px;text-align:center}
.tri b{display:block;font-size:clamp(17px,3.6vw,22px);font-weight:800;letter-spacing:-.02em}
.tri span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{--cp:26px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:var(--cp);box-shadow:var(--shadow);min-width:0}
@media (max-width:480px){.card{--cp:18px;border-radius:20px}}
.card h2{display:flex;align-items:center;gap:11px;font-size:19px;font-weight:700;letter-spacing:-.015em;margin:0 0 16px}
.hbadge{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--grad);color:#fff;flex:none}
.stack{display:flex;flex-direction:column;gap:18px}
.sec{margin-top:64px;scroll-margin-top:84px}
.sec-h{text-align:center;max-width:640px;margin:0 auto 28px}
.sec-h h2{font-size:clamp(25px,4.4vw,36px);font-weight:800;letter-spacing:-.03em;line-height:1.12;margin:10px 0 8px;text-wrap:balance}
.sec-h p{margin:0;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.steps{grid-template-columns:minmax(0,1fr)}}
.tile{--c:var(--ci1);background:color-mix(in srgb,var(--c) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 28%,var(--line));border-radius:22px;padding:22px;position:relative;min-width:0}
.tile .ti{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);margin-bottom:14px}
.tile h3{font-size:17px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}
.tile p{margin:0;color:var(--muted);font-size:14px}
.tile .no{position:absolute;right:20px;top:16px;font-size:28px;font-weight:800;color:color-mix(in srgb,var(--c) 55%,transparent);font-variant-numeric:tabular-nums}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.faq{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 18px}
.faq summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;font-weight:700}
.faq summary::-webkit-details-marker{display:none}
.faq summary svg{flex:none;color:var(--accent);transition:transform .15s}
.faq details[open] summary svg{transform:rotate(180deg)}
.faq details p{margin:0 0 16px;color:var(--muted)}
.cta{margin-top:64px;border-radius:28px;padding:clamp(26px,5vw,48px);background:var(--grad);color:#fff;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;overflow:hidden;box-shadow:0 30px 60px -30px #5B5FEF}
.cta::after{content:"";position:absolute;width:320px;height:320px;right:-80px;top:-140px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%);pointer-events:none}
.cta>*{position:relative;z-index:1}
.cta h2{margin:0;font-size:clamp(24px,4.4vw,36px);font-weight:800;letter-spacing:-.03em;line-height:1.12;text-wrap:balance}
.cta p{margin:0;opacity:.92;max-width:56ch}
.cta .btn.light{background:#fff;color:#1B1D55;border-color:#fff}

/* form */
label,.lab{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
.inp{width:100%;background:var(--field);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;min-width:0;transition:border-color .12s,box-shadow .12s}
.inp:hover{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.inp:disabled{opacity:.6}
.inp::placeholder{color:color-mix(in srgb,var(--muted) 80%,transparent)}
textarea.inp{font-family:var(--f-mono);font-size:13.5px;line-height:1.6;min-height:220px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.row2{grid-template-columns:minmax(0,1fr)}}
.slugbox{display:flex;align-items:stretch}
.slugbox span{display:grid;place-items:center;padding:0 14px;background:var(--grad);border-radius:12px 0 0 12px;font-family:var(--f-mono);color:#fff;font-weight:600}
.slugbox .inp{border-radius:0 12px 12px 0;font-family:var(--f-mono);font-size:14px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:18px}
.hint.ok{color:var(--ok)} .hint.bad{color:var(--bad)}
.check{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500;margin:0;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.seg{display:inline-flex;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-checked="true"],.seg button[aria-selected="true"]{background:var(--grad);color:#fff;box-shadow:0 8px 16px -8px #6366F1}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;padding:11px 13px;border-radius:14px;border:1.5px solid var(--line);background:var(--field);cursor:pointer;min-width:0}
.opt:hover{border-color:var(--accent)}
.opt svg{color:var(--muted);flex:none}
.opt b{display:block;font-size:13.5px;font-weight:700}
.opt small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] svg{color:var(--accent)}
.bodyhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bodyfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:7px;font-size:12.5px;color:var(--muted)}
.err{color:var(--bad);font-size:13.5px;min-height:20px}
.notice{background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:13.5px}
.notice.warn{background:var(--warn-soft)} .notice.good{background:var(--ok-soft)}

/* rak daftar */
.tabs{display:flex;gap:6px;margin:16px 0 12px;flex-wrap:wrap}
.tabs button{border:0;background:var(--surface2);padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--grad);color:#fff}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--field);border-radius:16px;padding:11px 13px;cursor:pointer}
.item:hover{border-color:var(--accent)}
.item .ib{min-width:0;flex:1}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--muted);margin-top:3px;align-items:center}
.empty{color:var(--muted);font-size:14px;padding:18px;background:var(--field);border:1px dashed var(--line);border-radius:14px;text-align:center}
.openbox{display:flex;gap:10px}
.fav{width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:17px;background:hsl(var(--h,230) 62% 46%);color:#fff}

/* panel (dashboard / kelola) */
.phead{margin-bottom:22px;display:flex;flex-direction:column;gap:8px}
.crumb{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.phead h1{margin:0;font-size:clamp(28px,5vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.phead p{margin:0;color:var(--muted);max-width:62ch}
.phead .actions{margin-top:6px}
.dash{display:flex;flex-direction:column;gap:18px}
.hello{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.avatar{width:52px;height:52px;border-radius:16px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.hello .tx{flex:1;min-width:180px}
.hello h2{margin:0 0 2px;font-size:19px}
.hello p{margin:0;font-size:13px;color:var(--muted)}
.kpi{position:relative;overflow:hidden}
.kpi .kl{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--c,var(--ci4))}
.kpi .kv{display:flex;align-items:baseline;gap:10px;margin:8px 0 6px;flex-wrap:wrap}
.kpi .kv b{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.kpi .ks{font-size:13px;color:var(--muted)}
.kpi .kic{position:absolute;right:20px;top:20px;color:color-mix(in srgb,var(--c,var(--ci4)) 50%,transparent)}
.kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:900px){.kgrid{grid-template-columns:minmax(0,1fr)}}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-dasharray:3 4;fill:none}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .bar{fill:var(--accent)} .chart .bar.today{fill:var(--accent2)}
.chart .bv{fill:var(--ink);font-size:11px;font-weight:700;font-family:var(--f-body)}
.rank{display:flex;flex-direction:column;gap:10px}
.rrow{display:flex;align-items:center;gap:12px;background:var(--field);border:1px solid var(--line);border-radius:16px;padding:12px 13px}
.rno{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;background:var(--surface2);color:var(--muted)}
.rrow:nth-child(1) .rno{background:var(--warn-soft);color:var(--warn)}
.rrow:nth-child(2) .rno{background:var(--accent-soft);color:var(--accent)}
.rrow:nth-child(3) .rno{background:var(--bad-soft);color:var(--bad)}
.rrow .rb{flex:1;min-width:0}
.rrow .rt{font-weight:700;overflow-wrap:anywhere}
.rrow .rs{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:4px}
.rrow .ra{display:flex;gap:6px;flex:none}
@media (max-width:560px){.rrow{flex-wrap:wrap}.rrow .ra{width:100%;justify-content:flex-end}}
.live{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:8px}
.feed{display:flex;flex-direction:column}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.frow .fl{min-width:0}
.frow b{display:block;overflow-wrap:anywhere;font-weight:600}
.frow span{font-size:12.5px;color:var(--muted)}
.frow .fr{text-align:right;flex:none;font-size:12.5px;color:var(--muted)}
.inv{background:linear-gradient(135deg,color-mix(in srgb,var(--ci1) 18%,var(--surface)),color-mix(in srgb,var(--ci6) 12%,var(--surface)))}
.inv h2{display:block;margin:10px 0 8px;font-size:22px;letter-spacing:-.02em}
.inv p{margin:0 0 16px;color:var(--muted)}
.mrow{display:flex;align-items:center;gap:12px;background:var(--field);border:1px solid var(--line);border-radius:16px;padding:12px 13px;flex-wrap:wrap}
.mrow .rb{flex:1;min-width:200px}
.mtools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.mtools .inp{flex:1 1 220px}

/* lihat paste */
.back{margin-bottom:16px}
.vcard{padding:0;overflow:hidden}
.vband{padding:var(--cp);background:linear-gradient(135deg,color-mix(in srgb,var(--ci1) 26%,var(--surface)),color-mix(in srgb,var(--ci6) 16%,var(--surface)));border-bottom:1px solid var(--line)}
.vbody{padding:var(--cp)}
.vhead h1{font-weight:800;font-size:clamp(24px,4.6vw,34px);letter-spacing:-.03em;line-height:1.12;margin:0 0 14px;overflow-wrap:anywhere;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.shortbox{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.shortbox .inp{flex:1 1 220px;font-family:var(--f-mono);font-size:13.5px}
.sharebar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.sep{height:1px;background:var(--line);margin:20px 0}
.links{display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:16px;background:var(--field);overflow:hidden}
.lrow:hover{border-color:var(--accent)}
.lrow .go{flex:1;min-width:0;display:flex;align-items:center;gap:13px;padding:12px 14px;text-decoration:none}
.lrow .tx{min-width:0;flex:1}
.lrow .lbl{display:block;font-weight:600;overflow-wrap:anywhere}
.lrow .url{display:block;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .url b{font-weight:500;color:var(--ink)}
.lrow .go:hover .url b{background:var(--hl);color:var(--hl-ink)}
.lrow .go>svg{color:var(--accent);flex:none}
.lrow .cp{border:0;border-left:1px solid var(--line);background:var(--surface2);width:50px;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.lrow .cp:hover{color:var(--accent)}
.sect{font-size:15px;font-weight:700;margin:12px 0 0;color:var(--accent)}
.textbody,.raw{font-family:var(--f-mono);font-size:13.5px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--field);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:0}
.textbody a{text-decoration:underline;text-decoration-color:var(--hl);text-decoration-thickness:3px;text-underline-offset:2px}
.lockbox{max-width:420px}
.authbox{max-width:460px;margin:8px auto 0}
.authbox h1{font-weight:800;font-size:27px;letter-spacing:-.03em;line-height:1.12;margin:0 0 6px}
.authart{display:grid;place-items:center;width:56px;height:56px;border-radius:18px;background:var(--grad);color:#fff;margin-bottom:14px;box-shadow:0 14px 28px -12px #6366F1}
.prose{max-width:720px}
.prose h2{font-size:17px;margin:22px 0 8px}
.prose p,.prose li{color:var(--muted)}
.prose ul{padding-left:20px;margin:0}

/* footer */
.ftr{margin-top:72px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface) 55%,var(--bg))}
.ftr-in{padding-block:40px 36px}
.fcols{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:30px}
@media (max-width:760px){.fcols{grid-template-columns:minmax(0,1fr)}}
.ftr p{color:var(--muted);margin:12px 0;max-width:46ch;font-size:14px}
.ftr h4{margin:0 0 12px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.ftr ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.ftr li a{color:var(--muted);text-decoration:none;font-size:14px}
.ftr li a:hover{color:var(--ink)}
.copy{margin-top:30px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between}

/* menu lipat + iklan + admin */
.moremenu{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface2)}
.moremenu[hidden]{display:none}
.moremenu .sharebar{margin:0}
.adwrap[hidden]{display:none}
.adwrap{padding-block:14px 0}
.adwrap.bot{padding-block:26px 0}
.adslot{max-width:728px;margin:0 auto;text-align:center}
.adtag{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.adslot a,.adslot .adimg{display:block;border-radius:14px;overflow:hidden;border:1px solid var(--line);line-height:0}
.adslot img{width:100%;height:auto;display:block}
.adslot iframe{width:100%;border:0;border-radius:14px;display:block;background:transparent}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:16px;background:var(--field);color:var(--ink);font-weight:700;text-align:left;cursor:pointer}
.sw .knob{flex:none;width:52px;height:30px;border-radius:999px;background:var(--surface2);border:1.5px solid var(--line);position:relative;transition:background .15s}
.sw .knob::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw[aria-checked="true"] .knob{background:var(--accent)}
.sw[aria-checked="true"] .knob::after{transform:translateX(22px);background:#fff}
.adbox{border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.adbox h3{margin:0;font-size:16px}
.adprev{min-height:10px}
.uidbox{font-family:var(--f-mono);font-size:13px;word-break:break-all;background:var(--field);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px}
@media (prefers-reduced-motion:reduce){.sw .knob,.sw .knob::after{transition:none}}

/* overlay + toast */
.ov{position:fixed;inset:0;background:rgba(3,6,20,.7);display:grid;place-items:center;padding:20px;z-index:60}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;max-width:340px;width:100%;text-align:center;box-shadow:var(--shadow)}
.qrbox{background:#fff;border-radius:14px;padding:14px;display:grid;place-items:center;margin:12px auto;width:fit-content;max-width:100%}
.qrbox img,.qrbox canvas{max-width:100%;height:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:70;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.toast,.btn,.faq summary svg{transition:none}.btn:hover{transform:none}}

/* ---------- routing ---------- */
function readSlug(){
  var h=''; try{h=decodeURIComponent(location.hash.slice(1));}catch(e){}

  if(PAGES[h]||SCROLLS[h])return h;
  return validSlug(h)?h:'';
}
function navTo(r,force){
  if(!force&&S.rendered&&r===S.slug)return;
  if(r!==S.flashSlug)S.flash='';
  S.slug=r; S.editing=false; S.raw=false; S.rendered=true; S.cur=null; S.menu=false; S.more=false;
  renderHeader(); renderAds();
  var k=kindOf(r);
  if(k==='home')renderHome();
  else if(k==='paste')openPaste(r);
  else if(k==='masuk')renderAuth();
  else if(k==='admin')renderAdmin();
  else if(k==='dashboard')renderDash();
  else if(k==='kelola')renderManage();

  else{try{window.scrollTo(0,0);}catch(e){}}
}

/* ---------- data (Firebase) ---------- */
function metaFrom(snap){return Object.assign({},snap.data(),{slug:snap.id});}
function openPaste(slug){
  S.cur={status:'loading'}; renderView();
  if(!S.db){ if(S.dbChecked){S.cur={status:'offline'};renderView();} return; }
  S.db.collection('pastes').doc(slug).get().then(function(ms){
    if(S.slug!==slug)return null;
    if(!ms.exists){S.cur={status:'notfound'};renderView();return null;}
    var meta=metaFrom(ms);
    if(isExpired(meta)){S.cur={status:'expired',meta:meta};renderView();return null;}
    return S.db.collection('contents').doc(slug).get().then(function(cs){
      if(S.slug!==slug)return;
      if(!cs.exists){S.cur={status:'notfound'};renderView();return;}
      var content=cs.data();
      if(meta.locked||content.enc){
        S.cur={status:'locked',meta:meta,content:content};
        var saved=S.pwds.get(slug);
        if(saved){ unlock(saved,true); return; }
      }else{
        S.cur={status:'ok',meta:meta,content:content,text:String(content.body||'')};
        recordView(slug,meta);
      }
      renderView();
    });
  }).catch(function(e){
    if(S.slug!==slug)return; S.cur={status:'error',err:e}; renderView();
  });
}
function unlock(pwd,silent){
  var cur=S.cur; if(!cur||!cur.content)return Promise.resolve();
  return decryptText(cur.content,pwd).then(function(text){
    if(S.cur!==cur)return;
    S.pwds.set(cur.meta.slug,pwd);
    S.cur={status:'ok',meta:cur.meta,content:cur.content,text:text,pwd:pwd};
    recordView(cur.meta.slug,cur.meta); renderView();
  }).catch(function(){
    if(S.cur!==cur)return;
    S.pwds.delete(cur.meta.slug);
    if(!silent){var e=$('#lock-err'); if(e)e.textContent='Kata sandi salah. Coba lagi.';} else renderView();
  });
}
function loadCount(slug){
  if(!S.db)return;
  S.db.collection('counts').doc(slug).get().then(function(s){
    var n=s.exists?(Number(s.data().n)||0):0; S.agg[slug]={total:n};
    var vc=$('#vc'); if(vc&&S.slug===slug)vc.textContent=nf(n)+' dilihat';
  }).catch(function(){});
}
function recordView(slug,meta){
  if(!S.db||!S.uid||!meta||S.viewed[slug]){loadCount(slug);return;}
  S.viewed[slug]=1;
  if(S.flash==='created'&&S.flashSlug===slug){loadCount(slug);return;}
  var db=S.db, inc=firebase.firestore.FieldValue.increment(1), owner=meta.ownerId, day=dayKey(Date.now()), now=Date.now();
  function bumpDoc(ref,create,extra){
    return ref.update(Object.assign({n:inc},extra||{})).catch(function(e){if(e&&e.code==='not-found')return ref.set(create);throw e;});
  }
  bumpDoc(db.collection('counts').doc(slug),{slug:slug,owner:owner,n:1}).then(function(){
    return bumpDoc(db.collection('hits').doc(slug+'~'+day),{slug:slug,day:day,owner:owner,n:1,last:now},{last:now});
  }).then(function(){loadCount(slug);}).catch(function(){loadCount(slug);});
}
function removePaste(slug){
  var db=S.db;
  return db.collection('contents').doc(slug).delete().then(function(){return db.collection('pastes').doc(slug).delete();}).then(function(){
    return Promise.all([
      db.collection('counts').doc(slug).delete().catch(function(){}),
      db.collection('hits').where('owner','==',S.uid).where('slug','==',slug).get().then(function(q){
        return Promise.all(q.docs.map(function(d){return d.ref.delete();}));
      }).catch(function(){})
    ]);
  }).then(function(){
    delete S.agg[slug]; S.hits.forEach(function(v,k){if(v.slug===slug)S.hits.delete(k);}); refreshLive();
  });
}
var unsubs=[];
function startData(){
  unsubs.forEach(function(u){try{u();}catch(e){}}); unsubs=[];
  S.pub=[]; S.mine=[]; S.agg={}; S.hits=new Map(); S.statsAt=0; S.listReady=false; rebuildMetas();
  var loadTimer=setTimeout(function(){if(!S.listReady){S.net='slow';renderStatus();}},10000);
  unsubs.push(S.db.collection('pastes').where('listed','==',true).orderBy('createdAt','desc').limit(30).onSnapshot(function(snap){
    clearTimeout(loadTimer); S.pub=snap.docs.map(metaFrom); S.listReady=true; S.net='ok'; renderStatus(); rebuildMetas(); refreshLive();
  },function(){clearTimeout(loadTimer);S.net='error';renderStatus();}));
  unsubs.push(S.db.collection('pastes').where('ownerId','==',S.uid).limit(300).onSnapshot(function(snap){
    S.mine=snap.docs.map(metaFrom); rebuildMetas(); refreshLive();
  },function(){}));
}
/* Statistik dibaca sekali saat Dashboard atau Kelola dibuka (hemat kuota baca harian). */
function loadStats(force){
  if(!S.db||!S.uid)return Promise.resolve();
  if(!force&&Date.now()-S.statsAt<15000)return Promise.resolve();
  S.statsAt=Date.now();
  var from=dayKey(Date.now()-6*86400000), db=S.db;
  return Promise.all([
    db.collection('counts').where('owner','==',S.uid).get(),
    db.collection('hits').where('owner','==',S.uid).where('day','>=',from).get()
  ]).then(function(r){
    var agg={}; r[0].docs.forEach(function(d){agg[d.id]={total:Number(d.data().n)||0};});
    var hm=new Map(); r[1].docs.forEach(function(d){var v=d.data(); if(v&&v.slug)hm.set(d.id,v);});
    S.agg=agg; S.hits=hm; refreshLive();
  }).catch(function(){});
}
function applyUser(u){
  var changed=S.uid!==u.uid;
  S.uid=u.uid; if(changed)S.isAdmin=null;
  if(!S.ads&&!S.adsAsked)loadAds();
  S.acct=(u.email&&u.email.slice(-ACCT_DOMAIN.length)===ACCT_DOMAIN)?u.email.slice(0,-ACCT_DOMAIN.length):'';
  S.dbChecked=true; renderHeader();
  if(changed)startData();
  if(!S.ready){S.ready=true;navTo(S.slug,true);}
  else if(changed)navTo(S.slug,true);
  else refreshLive();
}

/* ---------- akun (Firebase Authentication) ---------- */
function uerr(m){var e=new Error(m);e.user=true;return e;}
function registerAcct(name,pwd){
  var email=name+ACCT_DOMAIN, u=S.auth.currentUser, p;
  if(u&&u.isAnonymous)p=u.linkWithCredential(firebase.auth.EmailAuthProvider.credential(email,pwd));
  else p=S.auth.createUserWithEmailAndPassword(email,pwd);
  return p.then(function(){applyUser(S.auth.currentUser);}).catch(function(e){
    var c=e&&e.code;
    if(c==='auth/email-already-in-use'||c==='auth/credential-already-in-use')throw uerr('Nama pengguna sudah dipakai. Pilih yang lain.');
    if(c==='auth/weak-password')throw uerr('Kata sandi terlalu lemah. Pakai minimal 6 karakter.');
    throw e;
  });
}
function loginAcct(name,pwd){
  return S.auth.signInWithEmailAndPassword(name+ACCT_DOMAIN,pwd).then(function(){applyUser(S.auth.currentUser);}).catch(function(e){
    var c=e&&e.code;
    if(c==='auth/user-not-found'||c==='auth/wrong-password'||c==='auth/invalid-credential'||c==='auth/invalid-login-credentials')throw uerr('Nama pengguna atau kata sandi salah.');
    throw e;
  });
}

}

      el('p',{style:'font-size:14px;margin:0 0 12px;color:var(--muted)',text:'Masuk sebagai @'+S.acct+'. Salin ID akun di bawah, lalu daftarkan di Firebase:'}),
      el('div',{class:'uidbox',id:'uid-box',text:S.uid}),
      el('div',{style:'height:10px'}),
      el('button',{type:'button',class:'btn',onclick:function(){copyText(S.uid,'ID akun tersalin');}},icon('copy',16),'Salin ID akun'),
      el('div',{style:'height:14px'}),
      el('div',{class:'notice'},
        'Di konsol Firebase buka Firestore Database > Data > Start collection. Isi Collection ID ',el('b',{text:'admins'}),
        ', Document ID tempel ID akun tadi, tambah satu field bernama ',el('b',{text:'aktif'}),' bertipe boolean bernilai true, lalu Save. Setelah itu muat ulang halaman ini.'),
      el('div',{style:'height:14px'}),
      el('button',{type:'button',class:'btn',onclick:function(){S.isAdmin=null;renderAdmin();}},'Periksa lagi')]);
    return;
  }
  renderAdminPanel();
}
function renderAdminPanel(){
  var cfg=S.ads||{}, on=!!cfg.on;
  var sw=el('button',{type:'button',role:'switch',class:'sw','aria-checked':String(on)},el('span',{text:'Tampilkan iklan di situs'}),el('span',{class:'knob'}));
  sw.addEventListener('click',function(){on=!on;sw.setAttribute('aria-checked',String(on));});
  function slotBox(key,title){
    var d=cfg[key]||{};
    var img=el('input',{class:'inp',type:'url',inputmode:'url',autocomplete:'off',autocapitalize:'off',spellcheck:'false',placeholder:'https://…/banner.jpg',value:d.img||''});
    var href=el('input',{class:'inp',type:'url',inputmode:'url',autocomplete:'off',autocapitalize:'off',spellcheck:'false',placeholder:'https://tujuan-iklan.com',value:d.href||''});
    var code=el('textarea',{class:'inp',spellcheck:'false',autocapitalize:'off',autocomplete:'off',placeholder:'Tempel kode iklan dari jaringan iklan (opsional)',style:'min-height:110px'});
    code.value=d.code||'';
    var h=el('input',{class:'inp',type:'number',inputmode:'numeric',min:'50',max:'600',value:String(d.h||100)});
    var prev=el('div',{class:'adprev'}), t=null;
    function paint(){clearTimeout(t);t=setTimeout(function(){
      var n=adNode({img:img.value,href:href.value,code:code.value,h:h.value}); prev.replaceChildren(); if(n)prev.append(n);
    },400);}
    [img,href,code,h].forEach(function(i){i.addEventListener('input',paint);}); paint();
    return {node:el('div',{class:'adbox'},el('h3',{text:title}),
      el('div',null,el('label',{text:'Gambar banner (alamat https)'}),img),
      el('div',null,el('label',{text:'Link tujuan saat diketuk (https)'}),href),
      el('div',null,el('label',{text:'Atau kode iklan (menggantikan gambar jika diisi)'}),code),
      el('div',null,el('label',{text:'Tinggi kotak kode iklan (px, 50–600)'}),h),
      el('div',null,el('div',{class:'hint',text:'Pratinjau'}),prev)),
      get:function(){return {img:img.value.trim(),href:href.value.trim(),code:code.value.trim(),h:Math.max(50,Math.min(600,Math.round(Number(h.value)||100)))};}};
  }
  var top=slotBox('top','Iklan atas (di bawah header)'), bot=slotBox('bottom','Iklan bawah (di atas footer)');
  var err=el('div',{class:'err',role:'alert'}), save=el('button',{type:'button',class:'btn primary lg'},'Simpan');
  save.addEventListener('click',function(){
    err.textContent='';
    var data={on:on,top:top.get(),bottom:bot.get(),updatedAt:Date.now()}, bad='';
    [['top','atas'],['bottom','bawah']].forEach(function(p){var s=data[p[0]];
      if(s.img&&!httpsOnly(s.img))bad='Alamat gambar iklan '+p[1]+' harus diawali https://';
      if(s.href&&!httpsOnly(s.href))bad='Link tujuan iklan '+p[1]+' harus diawali https://';
      if(s.code.length>6000)bad='Kode iklan '+p[1]+' terlalu panjang (maksimal 6000 karakter).';});
    if(bad){err.textContent=bad;return;}
    save.disabled=true;
    S.db.collection('settings').doc('ads').set(data).then(function(){
      save.disabled=false; S.ads=data; S.adKey='#'; renderAds(); toast('Iklan disimpan');
    }).catch(function(e){
      save.disabled=false; err.textContent=(e&&e.code==='permission-denied')?'Ditolak. Akunmu belum terdaftar sebagai admin atau aturan keamanan belum diperbarui.':'Gagal menyimpan. Coba lagi.';
    });
  });
  $('#main').replaceChildren(el('section',{class:'card'},el('div',{class:'stack'},
    el('div',null,el('h1',{text:'Panel Admin',style:'margin:0 0 6px'}),el('span',{class:'chip info'},icon('shield',13),'@'+S.acct)),
    sw,top.node,bot.node,
    el('div',{class:'notice',text:'Banner gambar dan link paling pasti jalan. Kode iklan dari jaringan iklan dijalankan di kotak terisolasi, jadi sebagian jaringan iklan mungkin tidak menampilkannya.'}),
    err,el('div',{class:'actions'},save,el('button',{type:'button',class:'btn lg',onclick:function(){go('');}},'Lihat situs')))));
}

/* ---------- mulai ---------- */
function initFirebase(){
  var cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.apiKey||/^ISI/i.test(cfg.apiKey)){
    S.noConfig=true; S.dbChecked=true; S.net='offline'; renderStatus(); navTo(S.slug,true); return;
  }
  try{firebase.initializeApp(cfg);}catch(e){}
  S.auth=firebase.auth(); S.db=firebase.firestore();
  S.auth.onAuthStateChanged(function(u){
    if(!u){S.auth.signInAnonymously().catch(function(){S.dbChecked=true;S.net='error';renderStatus();navTo(S.slug,true);});return;}
    applyUser(u);
  });
}
function boot(){
  try{var t=localStorage.getItem('pl-theme'); if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}
  renderHeader(); renderFooter();
  window.addEventListener('hashchange',function(){navTo(readSlug());});
  navTo(readSlug(),true);
  initFirebase();
}
boot();
})();
</script>
